<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatGPT Conversation Archiver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>ChatGPT Archiver</h1>
    <p class="muted">Собрать переписку → сохранить в Google Docs</p>

    <button id="capture" class="primary">Собрать текущий чат</button>

    <section id="archive" class="archive hidden">
      <strong id="archiveTitle"></strong>
      <div id="archiveMeta" class="muted"></div>
    </section>

    <button id="newDoc" disabled>Сохранить в новый Google Doc</button>
    <button id="activeDoc" disabled>Вставить в открытый Google Doc</button>

    <p id="status" class="status">Готово.</p>
    <p class="note">MVP: текст и форматирование сохраняются через rich clipboard; картинки пока вставляются best-effort через HTML.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
